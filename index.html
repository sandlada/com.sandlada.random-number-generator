    <!-- Copied From SHARED Module -->
    <script>
        if(!document.themeConfig) {
            document.themeConfig = {}
        }
        document.themeConfig.isDark = JSON.parse(localStorage.getItem('theme-config-is-dark') ?? 'false')
        
        document.addEventListener('ui-change-to-light-theme', () => {
            if(document.documentElement.hasAttribute('dark')) {
                document.documentElement.removeAttribute('dark')
            }
            if(document.themeConfig.isDark) {
                document.themeConfig.isDark = false
            }
        })
        document.addEventListener('ui-change-to-dark-theme', () => {
            if(!document.themeConfig.isDark) {
                document.themeConfig.isDark = true
            }
            if(document.documentElement.hasAttribute('dark')) {
                return
            }
            document.documentElement.setAttribute('dark', '')
        })
        document.addEventListener('ui-save-changes', () => {
            localStorage.setItem('theme-config-is-dark', JSON.stringify(document.themeConfig.isDark))
        })

        // Init
        document.dispatchEvent(new Event(document.themeConfig.isDark ? 'ui-change-to-dark-theme' : 'ui-change-to-light-theme'))
    </script>
